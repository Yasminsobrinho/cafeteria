<!--Menu com links para os outros componentes-->
  <header>

    <nav id="nav">

        <a routerLink="/cardapio">Cardápio</a>
        <a routerLink="/login">Login</a>
      </div>

      <img [src]="imglogo" width="200px" id="logo">

      <div id="navBar2">
        <div class="barraPesquisa">

            <input type="text" id="campoPesquisa" placeholder="Buscar...">

            <button aria-label="Pesquisar">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </button>
        </div>

        <a routerLink="/carrinho"><img [src]="imgcarrinho" width="50px" id="carrinhoFoto"></a>

      </div>

    </nav>

    <!-- usei img [src] para puxar as variaveis do ts que estao com as imagens e exibir na tela-->
    <!-- <img [src]="imgheader" height="100vh" id="fotoHeader"> -->
  </header>

  <div id="fundo">
    <img [src]="imgheader" id="fotoHeader">
  </div>

<!-- Seção "Sobre" da página -->
  <div id="sobre" class="secao-sobre">
  <!-- Exibe o componente Sobre dentro da página Home -->

  
<app-sobre></app-sobre>
<app-local></app-local>
<app-playlist></app-playlist>

<section class="avaliacoes">
  <h2>O que nossos clientes dizem 💬</h2>

  <div class="carrossel-avaliacoes">

    <button class="seta esquerda" (click)="anterior()">
      ❮
    </button>

    <div class="avaliacoes-container">
      <div
        class="avaliacao"
        *ngFor="let avaliacao of avaliacoes; let i = index"
        [class.ativa]="i === indiceAtual"
      >

        <div class="cliente">
          <div class="avatar">
            {{ avaliacao.nome.charAt(0) }}
          </div>

          <div>
            <h3>{{ avaliacao.nome }}</h3>
            <span>{{ avaliacao.tipo }}</span>
          </div>
        </div>

        <div class="estrelas">
          {{ avaliacao.estrelas }}
        </div>

        <p>{{ avaliacao.comentario }}</p>

      </div>
    </div>

    <button class="seta direita" (click)="proxima()">
    ❯
    </button>

  </div>
</section>

<app-rodape></app-rodape>
</div>
