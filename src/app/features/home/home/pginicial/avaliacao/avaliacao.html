<div class="avaliacoes">

  <h1>Avaliações dos Clientes</h1>

  <p>Veja o que nossos clientes estão falando sobre nossa cafeteria!</p>

  <div class="formulario">

    <h2>Deixe sua avaliação</h2>

    <label>Nome:</label>
    <input
      type="text"
      [(ngModel)]="nome"
      placeholder="Digite seu nome"
    >

    <label>Nota:</label>

    <select [(ngModel)]="nota">
      <option [ngValue]="5">★★★★★</option>
      <option [ngValue]="4">★★★★☆</option>
      <option [ngValue]="3">★★★☆☆</option>
      <option [ngValue]="2">★★☆☆☆</option>
      <option [ngValue]="1">★☆☆☆☆</option>
    </select>

    <label>Comentário:</label>

    <textarea
      [(ngModel)]="comentario"
      placeholder="Digite seu comentário"
    ></textarea>

    <button (click)="adicionarAvaliacao()">
      Enviar avaliação
    </button>

  </div>

  <div class="lista">

    <h2>O que nossos clientes dizem</h2>

    <div class="card" *ngFor="let avaliacao of avaliacoes">

      <h3>{{ avaliacao.nome }}</h3>

      <div class="estrelas">
        <span *ngFor="let estrela of [1, 2, 3, 4, 5]">
          {{ estrela <= avaliacao.nota ? '★' : '☆' }}
        </span>
      </div>

      <p>{{ avaliacao.comentario }}</p>

    </div>

  </div>

</div>
