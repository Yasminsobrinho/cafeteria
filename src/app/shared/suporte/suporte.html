<div class="suporte">
  @if (aberto()) {
    <section class="painel" role="dialog" aria-label="Suporte ao cliente">
      <header class="painel-topo">
        <div class="topo-texto">
          <span class="marca">Aroma Café</span>
          <strong>Como podemos ajudar?</strong>
          <span class="horario">Atendimento de seg a sáb, 11h às 18h</span>
        </div>

        <button type="button" class="fechar" (click)="fechar()" aria-label="Fechar suporte">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </header>

      <div class="painel-corpo">
        <p class="titulo-faq"><span>Perguntas frequentes</span></p>

        @for (item of perguntas; track item.pergunta; let i = $index) {
          <div class="faq" [class.aberta]="perguntaAberta() === i">
            <button
              type="button"
              class="faq-pergunta"
              [attr.aria-expanded]="perguntaAberta() === i"
              (click)="alternarPergunta(i)"
            >
              <span>{{ item.pergunta }}</span>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>

            @if (perguntaAberta() === i) {
              <p class="faq-resposta">{{ item.resposta }}</p>
            }
          </div>
        }
      </div>

      <footer class="painel-rodape">
        <p>Ainda precisa de ajuda? Fale com a gente:</p>
        <div class="canais">
          <a [href]="whatsapp" target="_blank" rel="noopener" class="canal canal-whats">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"
              />
            </svg>
            WhatsApp
          </a>

          <a [href]="email" class="canal canal-email">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 6h16v12H4V6Z" />
              <path d="m4 7 8 6 8-6" />
            </svg>
            E-mail
          </a>
        </div>
      </footer>
    </section>
  }

  <button
    type="button"
    class="botao-flutuante"
    [attr.aria-expanded]="aberto()"
    aria-label="Abrir suporte ao cliente"
    (click)="alternar()"
  >
    @if (aberto()) {
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M6 6l12 12M18 6 6 18" />
      </svg>
    } @else {
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M4 5h16v11H9l-5 4V5Z" />
        <path d="M8.5 10h7M8.5 13h4" />
      </svg>
      <span class="rotulo-botao">Precisa de ajuda?</span>
    }
  </button>
</div>
